<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>
  <rect width="400" height="320" fill="#1A1A2E"/>
  <text x="200" y="25" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">ROWING BUSTE PENCHÉ 2 BRAS</text>
  <text x="200" y="42" text-anchor="middle" fill="#888" font-size="11">3 × 10 reps — Charge Légère</text>

  <!-- Sol -->
  <rect x="40" y="230" width="320" height="3" fill="#4A4A6A"/>

  <!-- Silhouette penchée -->
  <!-- Pieds -->
  <ellipse cx="120" cy="225" rx="22" ry="7" fill="#D4C4B0"/>
  <ellipse cx="160" cy="225" rx="22" ry="7" fill="#D4C4B0"/>
  <!-- Jambes -->
  <line x1="125" y1="218" x2="140" y2="170" stroke="#D4C4B0" stroke-width="16" stroke-linecap="round"/>
  <line x1="155" y1="218" x2="155" y2="170" stroke="#D4C4B0" stroke-width="16" stroke-linecap="round"/>
  <!-- Buste penché ~45° -->
  <rect x="145" y="120" width="100" height="55" rx="14" fill="#E8D5C4" transform="rotate(-35 195 147)"/>
  <!-- Tête -->
  <ellipse cx="255" cy="95" rx="20" ry="18" fill="#E8D5C4"/>

  <!-- Bras avec haltères pendant -->
  <line x1="200" y1="145" x2="230" y2="185" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="230" y1="185" x2="250" y2="225" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <rect x="235" y="220" width="30" height="8" rx="2" fill="#AAA"/>
  <circle cx="235" cy="224" r="7" fill="#888"/>
  <circle cx="265" cy="224" r="7" fill="#888"/>

  <line x1="210" y1="130" x2="260" y2="170" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="260" y1="170" x2="290" y2="210" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <rect x="275" y="205" width="30" height="8" rx="2" fill="#AAA"/>
  <circle cx="275" cy="209" r="7" fill="#888"/>
  <circle cx="305" cy="209" r="7" fill="#888"/>

  <!-- Flèches mouvement -->
  <line x1="250" y1="215" x2="225" y2="175" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="200" x2="255" y2="160" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="170" x2="245" y2="210" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="250" y1="155" x2="280" y2="195" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Angle buste -->
  <line x1="120" y1="225" x2="255" y2="95" stroke="#444" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="265" y="100" fill="#888" font-size="9">Buste ~45°</text>

  <!-- Muscles -->
  <text x="20" y="275" fill="#FF6B35" font-size="10">▬ Dorsaux</text>
  <text x="20" y="290" fill="#42A5F5" font-size="10">▬ Rhomboïdes</text>
  <text x="20" y="305" fill="#66BB6A" font-size="10">▬ Lombaires (stabilisation)</text>

  <!-- Vigilance -->
  <rect x="180" y="260" width="200" height="45" rx="6" fill="#2A2A4A" stroke="#FF6B35" stroke-width="1"/>
  <text x="190" y="278" fill="#FF6B35" font-size="10" font-weight="bold">⚠ Vigilance</text>
  <text x="190" y="293" fill="#CCC" font-size="9">Buste bien penché, dos droit</text>
  <text x="190" y="305" fill="#CCC" font-size="9">Charge légère, ne relâche pas les lombaires</text>
</svg>