<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="400" height="320" fill="url(#bgGrad)"/>

  <!-- Titre -->
  <text x="200" y="28" text-anchor="middle" fill="#E0E0E0" font-size="15" font-weight="bold" font-family="sans-serif">GAINAGE VENTRAL</text>
  <text x="200" y="45" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">3 × 30–45 sec — Poids du corps</text>

  <!-- Zone centrale décorative -->
  <circle cx="200" cy="155" r="75" fill="none" stroke="#2A2A4A" stroke-width="1.5"/>
  <circle cx="200" cy="155" r="60" fill="none" stroke="#2A2A4A" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="80" y1="180" x2="320" y2="180" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>  <circle cx="80" cy="180" r="8" fill="#FF6B35" filter="url(#glow)"/>  <circle cx="320" cy="180" r="8" fill="#FF6B35" filter="url(#glow)"/>  <line x1="80" y1="180" x2="110" y2="180" stroke="#42A5F5" stroke-width="4" stroke-linecap="round"/>  <line x1="290" y1="180" x2="320" y2="180" stroke="#42A5F5" stroke-width="4" stroke-linecap="round"/>  <text x="200" y="165" text-anchor="middle" fill="#FF6B35" font-size="11" font-family="sans-serif">CORE ENGAGÉ</text>  <text x="200" y="205" text-anchor="middle" fill="#888" font-size="9" font-family="sans-serif">CORPS EN LIGNE DROITE</text>  <line x1="60" y1="180" x2="340" y2="180" stroke="#4A4A6A" stroke-width="1" stroke-dasharray="4 2" opacity="0.5"/>

  <!-- Muscles sollicités -->
  <text x="25" y="275" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">▬ MUSCLES</text>
    <text x="25" y="290" fill="#FF6B35" font-size="9" font-family="sans-serif">▬ Transverse</text>
  <text x="25" y="305" fill="#42A5F5" font-size="9" font-family="sans-serif">▬ Rectus abdominis</text>
  <text x="25" y="320" fill="#66BB6A" font-size="9" font-family="sans-serif">▬ Érecteurs</text>

  <!-- Vigilance -->
  <rect x="195" y="258" width="185" height="52" rx="8" fill="#2A1A1A" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="208" y="272" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">⚠ VIGILANCE</text>
    <text x="208" y="288" fill="#CCC" font-size="9" font-family="sans-serif">Ne creuse pas le dos</text>
  <text x="208" y="290" fill="#CCC" font-size="9" font-family="sans-serif">Arrête en cas de douleur</text>
</svg>