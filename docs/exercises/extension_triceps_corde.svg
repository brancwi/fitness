<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#42A5F5"/>
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="400" height="320" fill="url(#bgGrad)"/>

  <!-- Titre -->
  <text x="200" y="28" text-anchor="middle" fill="#E0E0E0" font-size="15" font-weight="bold" font-family="sans-serif">EXTENSION TRICEPS CORDE</text>
  <text x="200" y="45" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">3 × 12 reps — Charge Légère</text>

  <!-- Zone centrale décorative -->
  <circle cx="200" cy="155" r="75" fill="none" stroke="#2A2A4A" stroke-width="1.5"/>
  <circle cx="200" cy="155" r="60" fill="none" stroke="#2A2A4A" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="200" y1="80" x2="200" y2="140" stroke="#666" stroke-width="3"/>  <circle cx="200" cy="75" r="8" fill="#888"/>  <line x1="190" y1="140" x2="190" y2="170" stroke="#D4C4B0" stroke-width="3"/>  <line x1="200" y1="140" x2="200" y2="170" stroke="#D4C4B0" stroke-width="3"/>  <line x1="210" y1="140" x2="210" y2="170" stroke="#D4C4B0" stroke-width="3"/>  <circle cx="185" cy="175" r="4" fill="#42A5F5"/>  <circle cx="200" cy="175" r="4" fill="#42A5F5"/>  <circle cx="215" cy="175" r="4" fill="#42A5F5"/>  <line x1="200" y1="185" x2="200" y2="155" stroke="#42A5F5" stroke-width="2.5" marker-end="url(#arrow)" opacity="1"/>  <text x="200" y="205" text-anchor="middle" fill="#888" font-size="9" font-family="sans-serif">ÉCARTER À LA FIN</text>

  <!-- Muscles sollicités -->
  <text x="25" y="275" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">▬ MUSCLES</text>
    <text x="25" y="290" fill="#42A5F5" font-size="9" font-family="sans-serif">▬ Triceps (3 chefs)</text>

  <!-- Vigilance -->
  <rect x="195" y="258" width="185" height="52" rx="8" fill="#2A1A1A" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="208" y="272" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">⚠ VIGILANCE</text>
    <text x="208" y="288" fill="#CCC" font-size="9" font-family="sans-serif">Ne laisse pas les coudes s'écarter</text>
  <text x="208" y="290" fill="#CCC" font-size="9" font-family="sans-serif">Mouvement strict et contrôlé</text>
</svg>