<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>
  <rect width="400" height="320" fill="#1A1A2E"/>
  <text x="200" y="25" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">EXTENSION TRICEPS CORDE / HALTÈRE</text>
  <text x="200" y="42" text-anchor="middle" fill="#888" font-size="11">3 × 12 reps — Charge Légère</text>

  <!-- Variante corde -->
  <text x="100" y="60" text-anchor="middle" fill="#888" font-size="10">Corde à la poulie haute</text>

  <!-- Poulie -->
  <rect x="85" y="55" width="4" height="120" fill="#666"/>
  <circle cx="87" cy="55" r="8" fill="#888"/>
  <circle cx="87" cy="170" r="6" fill="#888"/>
  <!-- Corde -->
  <line x1="87" y1="170" x2="87" y2="220" stroke="#D4C4B0" stroke-width="3"/>
  <line x1="82" y1="220" x2="82" y2="235" stroke="#D4C4B0" stroke-width="3"/>
  <line x1="92" y1="220" x2="92" y2="235" stroke="#D4C4B0" stroke-width="3"/>
  <!-- Noeuds corde -->
  <circle cx="82" cy="238" r="5" fill="#D4C4B0"/>
  <circle cx="92" cy="238" r="5" fill="#D4C4B0"/>

  <!-- Silhouette -->
  <ellipse cx="87" cy="120" rx="20" ry="18" fill="#E8D5C4"/>
  <rect x="70" y="135" width="34" height="48" rx="12" fill="#D4C4B0"/>
  <line x1="78" y1="180" x2="75" y2="230" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <line x1="96" y1="180" x2="100" y2="230" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="72" cy="235" rx="16" ry="6" fill="#D4C4B0"/>
  <ellipse cx="103" cy="235" rx="16" ry="6" fill="#D4C4B0"/>

  <!-- Bras écartés avec corde -->
  <line x1="80" y1="148" x2="72" y2="195" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="72" y1="195" x2="82" y2="235" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <line x1="94" y1="148" x2="102" y2="195" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="102" y1="195" x2="92" y2="235" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>

  <!-- Flèche corde -->
  <line x1="87" y1="210" x2="87" y2="185" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="87" y1="180" x2="87" y2="205" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Variante haltère -->
  <text x="300" y="60" text-anchor="middle" fill="#888" font-size="10">Haltère à deux mains</text>

  <!-- Silhouette debout -->
  <ellipse cx="300" cy="105" rx="20" ry="18" fill="#E8D5C4"/>
  <rect x="282" y="120" width="36" height="50" rx="12" fill="#D4C4B0"/>
  <line x1="290" y1="168" x2="285" y2="225" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <line x1="310" y1="168" x2="315" y2="225" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="282" cy="230" rx="16" ry="6" fill="#D4C4B0"/>
  <ellipse cx="318" cy="230" rx="16" ry="6" fill="#D4C4B0"/>

  <!-- Bras avec haltère derrière la tête -->
  <line x1="282" y1="130" x2="260" y2="155" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="260" y1="155" x2="270" y2="190" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <!-- Haltère -->
  <rect x="262" y="186" width="22" height="8" rx="2" fill="#AAA"/>
  <circle cx="262" cy="190" r="7" fill="#888"/>
  <circle cx="284" cy="190" r="7" fill="#888"/>

  <!-- Flèche haltère -->
  <line x1="267" y1="180" x2="263" y2="160" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="155" x2="264" y2="175" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Muscles -->
  <text x="20" y="275" fill="#FF6B35" font-size="10">▬ Triceps brachial</text>

  <!-- Vigilance -->
  <rect x="180" y="260" width="200" height="45" rx="6" fill="#2A2A4A" stroke="#FF6B35" stroke-width="1"/>
  <text x="190" y="278" fill="#FF6B35" font-size="10" font-weight="bold">⚠ Vigilance</text>
  <text x="190" y="293" fill="#CCC" font-size="9">Ne laisse pas les coudes s'écarter latéralement</text>
  <text x="190" y="305" fill="#CCC" font-size="9">Contrôle la phase de retour</text>
</svg>