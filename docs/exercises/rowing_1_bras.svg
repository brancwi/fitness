<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="400" height="320" fill="url(#bgGrad)"/>

  <!-- Titre -->
  <text x="200" y="28" text-anchor="middle" fill="#E0E0E0" font-size="15" font-weight="bold" font-family="sans-serif">ROWING 1 BRAS</text>
  <text x="200" y="45" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">3 × 10 reps — Charge Modérée</text>

  <!-- Zone centrale décorative -->
  <circle cx="200" cy="155" r="75" fill="none" stroke="#2A2A4A" stroke-width="1.5"/>
  <circle cx="200" cy="155" r="60" fill="none" stroke="#2A2A4A" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="140" y="100" width="120" height="8" rx="3" fill="#4A4A6A"/>  <rect x="155" y="108" width="6" height="20" fill="#3A3A5A"/>  <rect x="239" y="108" width="6" height="20" fill="#3A3A5A"/>
  <rect x="237.5" y="150.0" width="45" height="10" rx="5.0" fill="#666"/>
  <rect x="231.5" y="146.0" width="8" height="18" rx="2" fill="#42A5F5"/>
  <rect x="280.5" y="146.0" width="8" height="18" rx="2" fill="#42A5F5"/>  <line x1="260" y1="170" x2="260" y2="140" stroke="#42A5F5" stroke-width="2.5" marker-end="url(#arrow)" opacity="1"/>  <circle cx="200" cy="155" r="4" fill="#42A5F5" filter="url(#glow)"/>  <text x="200" y="175" text-anchor="middle" fill="#42A5F5" font-size="9" font-family="sans-serif">COUDE RENTRÉ</text>

  <!-- Muscles sollicités -->
  <text x="25" y="275" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">▬ MUSCLES</text>
    <text x="25" y="290" fill="#FF6B35" font-size="9" font-family="sans-serif">▬ Dorsaux</text>
  <text x="25" y="305" fill="#42A5F5" font-size="9" font-family="sans-serif">▬ Rhomboïdes</text>
  <text x="25" y="320" fill="#66BB6A" font-size="9" font-family="sans-serif">▬ Biceps</text>

  <!-- Vigilance -->
  <rect x="195" y="258" width="185" height="52" rx="8" fill="#2A1A1A" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="208" y="272" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">⚠ VIGILANCE</text>
    <text x="208" y="288" fill="#CCC" font-size="9" font-family="sans-serif">Alterne les bras</text>
  <text x="208" y="290" fill="#CCC" font-size="9" font-family="sans-serif">Garde le dos droit</text>
</svg>