<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>
  <rect width="400" height="320" fill="#1A1A2E"/>
  <text x="200" y="25" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">ROWING 1 BRAS (GENOU SUR BANC)</text>
  <text x="200" y="42" text-anchor="middle" fill="#888" font-size="11">3 × 10 reps — Charge Modérée</text>

  <!-- Banc -->
  <rect x="120" y="80" width="160" height="10" rx="3" fill="#4A4A6A"/>
  <rect x="140" y="90" width="8" height="40" fill="#3A3A5A"/>
  <rect x="252" y="90" width="8" height="40" fill="#3A3A5A"/>

  <!-- Silhouette -->
  <!-- Genou gauche sur banc -->
  <ellipse cx="180" cy="78" rx="18" ry="12" fill="#D4C4B0"/>
  <!-- Main gauche sur banc -->
  <ellipse cx="240" cy="78" rx="12" ry="8" fill="#D4C4B0"/>
  <!-- Buste horizontal -->
  <rect x="170" y="55" width="90" height="22" rx="10" fill="#E8D5C4" transform="rotate(-5 215 66)"/>
  <!-- Tête -->
  <ellipse cx="150" cy="55" rx="18" ry="16" fill="#E8D5C4"/>
  <!-- Bras gauche (appui) -->
  <line x1="180" y1="70" x2="240" y2="78" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <!-- Jambe droite au sol -->
  <line x1="195" y1="85" x2="220" y2="160" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <line x1="220" y1="160" x2="225" y2="220" stroke="#D4C4B0" stroke-width="12" stroke-linecap="round"/>
  <!-- Pied droit -->
  <ellipse cx="230" cy="225" rx="18" ry="8" fill="#D4C4B0"/>

  <!-- Bras droit avec haltère -->
  <line x1="215" y1="65" x2="265" y2="110" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="265" y1="110" x2="280" y2="160" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <!-- Haltère -->
  <rect x="270" y="155" width="30" height="8" rx="2" fill="#AAA"/>
  <circle cx="270" cy="159" r="8" fill="#888"/>
  <circle cx="300" cy="159" r="8" fill="#888"/>

  <!-- Flèche mouvement -->
  <line x1="275" y1="150" x2="250" y2="125" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="120" x2="275" y2="145" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Muscles -->
  <text x="20" y="275" fill="#FF6B35" font-size="10">▬ Dorsaux</text>
  <text x="20" y="290" fill="#42A5F5" font-size="10">▬ Rhomboïdes</text>
  <text x="20" y="305" fill="#66BB6A" font-size="10">▬ Biceps</text>

  <!-- Vigilance -->
  <rect x="180" y="260" width="200" height="45" rx="6" fill="#2A2A4A" stroke="#FF6B35" stroke-width="1"/>
  <text x="190" y="278" fill="#FF6B35" font-size="10" font-weight="bold">⚠ Vigilance</text>
  <text x="190" y="293" fill="#CCC" font-size="9">Alterne les bras à chaque série</text>
  <text x="190" y="305" fill="#CCC" font-size="9">Garde le dos droit et la colonne neutre</text>
</svg>