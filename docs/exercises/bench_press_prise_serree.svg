<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="400" height="320" fill="url(#bgGrad)"/>

  <!-- Titre -->
  <text x="200" y="28" text-anchor="middle" fill="#E0E0E0" font-size="15" font-weight="bold" font-family="sans-serif">BENCH PRESS PRISE SERRÉE</text>
  <text x="200" y="45" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">3 × 8–10 reps — Charge Modérée</text>

  <!-- Zone centrale décorative -->
  <circle cx="200" cy="155" r="75" fill="none" stroke="#2A2A4A" stroke-width="1.5"/>
  <circle cx="200" cy="155" r="60" fill="none" stroke="#2A2A4A" stroke-width="1" stroke-dasharray="4 4"/>

  
  <rect x="162.5" y="135.0" width="35" height="10" rx="5.0" fill="#666"/>
  <rect x="156.5" y="131.0" width="8" height="18" rx="2" fill="#FF6B35"/>
  <rect x="195.5" y="131.0" width="8" height="18" rx="2" fill="#FF6B35"/>
  <rect x="202.5" y="135.0" width="35" height="10" rx="5.0" fill="#666"/>
  <rect x="196.5" y="131.0" width="8" height="18" rx="2" fill="#FF6B35"/>
  <rect x="235.5" y="131.0" width="8" height="18" rx="2" fill="#FF6B35"/>
  <rect x="176.0" y="155.0" width="8" height="30" rx="4.0" fill="#666"/>
  <rect x="172.0" y="149.0" width="16" height="10" rx="2" fill="#FF6B35"/>
  <rect x="172.0" y="181.0" width="16" height="10" rx="2" fill="#FF6B35"/>
  <rect x="216.0" y="155.0" width="8" height="30" rx="4.0" fill="#666"/>
  <rect x="212.0" y="149.0" width="16" height="10" rx="2" fill="#FF6B35"/>
  <rect x="212.0" y="181.0" width="16" height="10" rx="2" fill="#FF6B35"/>  <line x1="180" y1="160" x2="180" y2="130" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="1"/>  <line x1="220" y1="160" x2="220" y2="130" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="1"/>  <rect x="100" y="210" width="200" height="8" rx="3" fill="#4A4A6A"/>  <rect x="120" y="218" width="8" height="25" fill="#3A3A5A"/>  <rect x="272" y="218" width="8" height="25" fill="#3A3A5A"/>

  <!-- Muscles sollicités -->
  <text x="25" y="275" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">▬ MUSCLES</text>
    <text x="25" y="290" fill="#FF6B35" font-size="9" font-family="sans-serif">▬ Pectoraux méd.</text>
  <text x="25" y="305" fill="#42A5F5" font-size="9" font-family="sans-serif">▬ Triceps</text>
  <text x="25" y="320" fill="#66BB6A" font-size="9" font-family="sans-serif">▬ Deltoïdes ant.</text>

  <!-- Vigilance -->
  <rect x="195" y="258" width="185" height="52" rx="8" fill="#2A1A1A" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="208" y="272" fill="#FF6B35" font-size="10" font-weight="bold" font-family="sans-serif">⚠ VIGILANCE</text>
    <text x="208" y="288" fill="#CCC" font-size="9" font-family="sans-serif">Ne creuse pas le dos</text>
  <text x="208" y="290" fill="#CCC" font-size="9" font-family="sans-serif">Concentration sur les triceps</text>
</svg>