  <line x1="220" y1="90" x2="260" y2="120" stroke="#D4C4B0" stroke-width="11" stroke-linecap="round"/>
  <line x1="260" y1="120" x2="285" y2="160" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <!-- Haltère neutre -->
  <rect x="275" y="155" width="8" height="28" rx="2" fill="#AAA"/>
  <circle cx="279" cy="155" r="7" fill="#888"/>
  <circle cx="279" cy="183" r="7" fill="#888"/>

  <!-- Bras gauche haut -->
  <line x1="180" y1="90" x2="145" y2="120" stroke="#D4C4B0" stroke-width="11" stroke-linecap="round"/>
  <line x1="145" y1="120" x2="125" y2="90" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <!-- Haltère neutre -->
  <rect x="107" y="85" width="8" height="28" rx="2" fill="#AAA"/>
  <circle cx="111" cy="85" r="7" fill="#888"/>
  <circle cx="111" cy="113" r="7" fill="#888"/>

