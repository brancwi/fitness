<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>
  <rect width="400" height="320" fill="#1A1A2E"/>
  <text x="200" y="25" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">ÉLÉVATIONS LATÉRALES</text>
  <text x="200" y="42" text-anchor="middle" fill="#888" font-size="11">3 × 12 reps — Charge Légère</text>

  <!-- Silhouette -->
  <ellipse cx="200" cy="75" rx="20" ry="18" fill="#E8D5C4"/>
  <rect x="182" y="90" width="36" height="50" rx="12" fill="#D4C4B0"/>
  <!-- Jambes -->
  <line x1="192" y1="136" x2="188" y2="210" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <line x1="208" y1="136" x2="212" y2="210" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="185" cy="215" rx="18" ry="6" fill="#D4C4B0"/>
  <ellipse cx="215" cy="215" rx="18" ry="6" fill="#D4C4B0"/>

  <!-- Bras bas -->
  <line x1="182" y1="100" x2="140" y2="130" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <line x1="140" y1="130" x2="120" y2="165" stroke="#D4C4B0" stroke-width="8" stroke-linecap="round"/>
  <rect x="108" y="160" width="22" height="6" rx="2" fill="#AAA"/>
  <circle cx="108" cy="163" r="6" fill="#888"/>
  <circle cx="130" cy="163" r="6" fill="#888"/>

  <!-- Bras haut -->
  <line x1="218" y1="100" x2="275" y2="115" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <line x1="275" y1="115" x2="310" y2="120" stroke="#D4C4B0" stroke-width="8" stroke-linecap="round"/>
  <rect x="300" y="116" width="22" height="6" rx="2" fill="#AAA"/>
  <circle cx="300" cy="119" r="6" fill="#888"/>
  <circle cx="322" cy="119" r="6" fill="#888"/>

  <!-- Flèches -->
  <line x1="130" y1="150" x2="145" y2="115" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="120" x2="275" y2="155" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Ligne horizontale référence -->
  <line x1="310" y1="120" x2="340" y2="120" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="345" y="123" fill="#888" font-size="9">Épaules</text>

  <!-- Muscles -->
  <text x="20" y="275" fill="#FF6B35" font-size="10">▬ Deltoïdes latéraux</text>

  <!-- Vigilance -->
  <rect x="180" y="260" width="200" height="45" rx="6" fill="#2A2A4A" stroke="#FF6B35" stroke-width="1"/>
  <text x="190" y="278" fill="#FF6B35" font-size="10" font-weight="bold">⚠ Vigilance</text>
  <text x="190" y="293" fill="#CCC" font-size="9">Ne balance pas le buste</text>
  <text x="190" y="305" fill="#CCC" font-size="9">Charge légère, contrôle total</text>
</svg>