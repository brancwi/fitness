<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>
  <rect width="400" height="320" fill="#1A1A2E"/>
  <text x="200" y="25" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">EXTENSION TRICEPS</text>
  <text x="200" y="42" text-anchor="middle" fill="#888" font-size="11">3 × 12 reps — Charge Légère</text>

  <!-- Variante couchée -->
  <rect x="30" y="180" width="160" height="10" rx="4" fill="#4A4A6A"/>
  <text x="110" y="170" text-anchor="middle" fill="#888" font-size="10">Variante couchée</text>

  <!-- Silhouette couchée -->
  <ellipse cx="110" cy="130" rx="22" ry="18" fill="#E8D5C4"/>
  <rect x="85" y="140" width="120" height="22" rx="10" fill="#D4C4B0"/>
  <line x1="205" y1="148" x2="240" y2="125" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="240" y1="125" x2="260" y2="90" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <!-- Haltère au-dessus -->
  <rect x="245" y="85" width="30" height="8" rx="2" fill="#AAA" transform="rotate(-30 260 89)"/>
  <circle cx="245" cy="89" r="7" fill="#888"/>
  <circle cx="275" cy="89" r="7" fill="#888"/>

  <line x1="85" y1="148" x2="55" y2="170" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>

  <!-- Flèche couchée -->
  <line x1="255" y1="105" x2="245" y2="125" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="130" x2="250" y2="110" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Variante debout -->
  <rect x="210" y="180" width="160" height="10" rx="4" fill="#4A4A6A"/>
  <text x="290" y="170" text-anchor="middle" fill="#888" font-size="10">Variante debout</text>

  <!-- Silhouette debout -->
  <ellipse cx="290" cy="105" rx="20" ry="18" fill="#E8D5C4"/>
  <rect x="270" y="120" width="40" height="55" rx="14" fill="#D4C4B0"/>
  <line x1="275" y1="170" x2="270" y2="230" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <line x1="305" y1="170" x2="310" y2="230" stroke="#D4C4B0" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="268" cy="235" rx="16" ry="6" fill="#D4C4B0"/>
  <ellipse cx="312" cy="235" rx="16" ry="6" fill="#D4C4B0"/>

  <!-- Bras avec haltère derrière -->
  <line x1="270" y1="130" x2="245" y2="160" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <line x1="245" y1="160" x2="255" y2="200" stroke="#D4C4B0" stroke-width="9" stroke-linecap="round"/>
  <rect x="245" y="195" width="25" height="8" rx="2" fill="#AAA"/>
  <circle cx="245" cy="199" r="7" fill="#888"/>
  <circle cx="270" cy="199" r="7" fill="#888"/>

  <!-- Flèche debout -->
  <line x1="252" y1="185" x2="248" y2="165" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="160" x2="252" y2="180" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Muscles -->
  <text x="20" y="275" fill="#FF6B35" font-size="10">▬ Triceps brachial</text>

  <!-- Vigilance -->
  <rect x="180" y="260" width="200" height="45" rx="6" fill="#2A2A4A" stroke="#FF6B35" stroke-width="1"/>
  <text x="190" y="278" fill="#FF6B35" font-size="10" font-weight="bold">⚠ Vigilance</text>
  <text x="190" y="293" fill="#CCC" font-size="9">Ne laisse pas les coudes s'écarter</text>
  <text x="190" y="305" fill="#CCC" font-size="9">Mouvement strict, pas d'oscillation</text>
</svg>