<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35"/>
    </marker>
  </defs>
  <rect width="400" height="320" fill="#1A1A2E"/>
  <text x="200" y="25" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">BENCH PRESS HALTÈRES</text>
  <text x="200" y="42" text-anchor="middle" fill="#888" font-size="11">3 × 8–10 reps — Charge Modérée</text>

  <!-- Banc -->
  <rect x="50" y="220" width="300" height="12" rx="4" fill="#4A4A6A"/>
  <rect x="80" y="232" width="10" height="40" fill="#3A3A5A"/>
  <rect x="310" y="232" width="10" height="40" fill="#3A3A5A"/>

  <!-- Silhouette allongée -->
  <ellipse cx="200" cy="185" rx="35" ry="25" fill="#E8D5C4"/>
  <rect x="130" y="175" width="140" height="22" rx="10" fill="#D4C4B0"/>
  <rect x="80" y="178" width="60" height="16" rx="8" fill="#D4C4B0"/>
  <rect x="260" y="178" width="60" height="16" rx="8" fill="#D4C4B0"/>

  <!-- Bras avec haltères -->
  <line x1="80" y1="186" x2="45" y2="150" stroke="#D4C4B0" stroke-width="12" stroke-linecap="round"/>
  <line x1="45" y1="150" x2="55" y2="110" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <circle cx="55" cy="105" r="14" fill="#888"/>
  <rect x="35" y="100" width="40" height="10" rx="3" fill="#AAA"/>

  <line x1="320" y1="186" x2="355" y2="150" stroke="#D4C4B0" stroke-width="12" stroke-linecap="round"/>
  <line x1="355" y1="150" x2="345" y2="110" stroke="#D4C4B0" stroke-width="10" stroke-linecap="round"/>
  <circle cx="345" cy="105" r="14" fill="#888"/>
  <rect x="325" y="100" width="40" height="10" rx="3" fill="#AAA"/>

  <!-- Flèches mouvement -->
  <line x1="55" y1="130" x2="55" y2="160" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="130" x2="345" y2="160" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="55" y1="175" x2="55" y2="145" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="345" y1="175" x2="345" y2="145" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Muscles sollicités -->
  <text x="20" y="275" fill="#FF6B35" font-size="10">▬ Pectoraux</text>
  <text x="20" y="290" fill="#42A5F5" font-size="10">▬ Deltoïdes ant.</text>
  <text x="20" y="305" fill="#66BB6A" font-size="10">▬ Triceps</text>

  <!-- Vigilance -->
  <rect x="180" y="260" width="200" height="45" rx="6" fill="#2A2A4A" stroke="#FF6B35" stroke-width="1"/>
  <text x="190" y="278" fill="#FF6B35" font-size="10" font-weight="bold">⚠ Vigilance</text>
  <text x="190" y="293" fill="#CCC" font-size="9">Ne creuse pas le dos</text>
  <text x="190" y="305" fill="#CCC" font-size="9">Colonne soutenue sur le banc</text>
</svg>